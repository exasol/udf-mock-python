# Last generated with exasol-toolbox version 10.4.0.
name: Merge-Gate

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  run-fast-checks:
    name: Fast Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  run-fast-tests:
    name: Fast Tests
    uses: ./.github/workflows/fast-tests.yml
    permissions:
      contents: read

  fast-report:
    name: Fast Report
    needs:
      - run-fast-checks
      - run-fast-tests
    uses: ./.github/workflows/report.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read

  allow-merge:
    name: Allow Merge
    if: ${{ !cancelled() }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    # If you need additional jobs to be part of the merge gate, add them below
    needs:
      - run-fast-checks
      - run-fast-tests
    steps:
      - name: Branch Protection - failure if any ancestor failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          exit 1
      - name: branch protection
        run: echo "All required checks passed. Merge allowed."

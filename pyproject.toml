[project]
name = "exasol-udf-mock-python"
version = "0.5.0"
description = "Mocking framework for Exasol Python UDFs"
authors = [{ name = "Torsten Kilias", email = "torsten.kilias@exasol.com" }]
requires-python = ">=3.10.0,<4.0"
readme = "README.rst"
license = "MIT"
keywords = [
    "exasol",
    "udf",
    "mock",
    "testing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2.3,<3",
    "numpy>=1.26.4,<3",
]
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/exasol/udf-mock-python"
homepage = "https://github.com/exasol/udf-mock-python"

[dependency-groups]
dev = [
    "exasol-toolbox>=8.1.1,<9",
    "pytest>=8.2.2,<10",
    "pytest-cov>=5.0.0,<6",
]

[tool.poetry]
requires-poetry = ">=2.3.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
extend-ignore = [
    "E", # Syntax errors
    "F", # Pyflakes rules (excluding F401)
    "UP", # pyupgrade rules
    "D", # Docstring rules
]
extend-select = ["F401"]
unfixable = []

[tool.sonar]
projectKey = "com.exasol:udf-mock-python"
host.url = "https://sonarcloud.io"
organization = "exasol"
